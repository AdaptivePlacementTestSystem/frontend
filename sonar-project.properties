# SonarCloud — organization key và project key lấy từ SonarCloud (không phải bí mật). Project key phân biệt chữ hoa/thường.
sonar.organization=adaptiveplacementtest
sonar.projectKey=AdaptivePlacementTest_frontend

sonar.sources=src
sonar.tests=tests
sonar.exclusions=src/components/ui/**,**/*.test.ts,**/*.test.tsx
# Mã shadcn/ui sinh sẵn: chỉ loại khỏi coverage (không có test riêng); KHÔNG loại khỏi đo trùng lặp (đo thật: 0%)
sonar.coverage.exclusions=src/components/ui/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
